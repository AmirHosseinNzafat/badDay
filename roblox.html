<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RobloxDevs IR | روبلاکس‌سازان ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ========== THEME VARIABLES ========== */
  :root {
    --bg: #0a0a0f;
    --bg-2: #12121c;
    --card: #16162a;
    --card-hover: #1e1e35;
    --card-2: #1c1c30;
    --primary: #7c3aed;
    --primary-2: #a855f7;
    --primary-soft: rgba(124,58,237,0.15);
    --accent: #06b6d4;
    --text: #e5e7eb;
    --text-strong: #ffffff;
    --muted: #9ca3af;
    --border: #2a2a40;
    --border-soft: #1e1e30;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --gold: #fbbf24;
    --shadow: 0 10px 40px rgba(0,0,0,0.4);
    --shadow-sm: 0 4px 15px rgba(0,0,0,0.2);
    --glass: rgba(22,22,42,0.7);
    --gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
  }

  [data-theme="light"] {
    --bg: #f5f5fa;
    --bg-2: #ebebf5;
    --card: #ffffff;
    --card-hover: #f9f9ff;
    --card-2: #f0f0fa;
    --primary: #7c3aed;
    --primary-2: #9333ea;
    --primary-soft: rgba(124,58,237,0.1);
    --accent: #0891b2;
    --text: #1f2937;
    --text-strong: #0f172a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-soft: #f0f0f5;
    --shadow: 0 10px 40px rgba(0,0,0,0.08);
    --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
    --glass: rgba(255,255,255,0.8);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  [dir="ltr"] body { font-family: 'Inter', 'Vazirmatn', sans-serif; }

  body::before {
    content: '';
    position: fixed;
    top: -50%; right: -50%;
    width: 100%; height: 100%;
    background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
    z-index: -1;
    pointer-events: none;
  }

  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-2); }
  ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary-2); }

  /* ========== SVG ICONS ========== */
  .icon {
    width: 18px; height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
    stroke-width: 2;
  }
  .icon-sm { width: 14px; height: 14px; }
  .icon-lg { width: 24px; height: 24px; }
  .icon-xl { width: 32px; height: 32px; }

  /* ========== NAVBAR ========== */
  nav {
    position: sticky;
    top: 0;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    padding: 0.8rem 1.5rem;
    transition: all 0.3s;
  }

  .nav-container {
    max-width: 1500px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.2rem;
    font-weight: 900;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    cursor: pointer;
    white-space: nowrap;
  }

  .logo-icon {
    width: 38px; height: 38px;
    background: var(--gradient);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 4px 15px rgba(124,58,237,0.4);
    flex-shrink: 0;
  }

  .logo-icon svg { width: 22px; height: 22px; stroke: white; }

  .nav-links {
    display: flex;
    gap: 0.2rem;
    list-style: none;
    flex-wrap: wrap;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    padding: 0.5rem 0.85rem;
    border-radius: 8px;
    transition: all 0.2s;
    font-size: 0.87rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .nav-links a:hover, .nav-links a.active {
    color: var(--text);
    background: var(--card);
  }

  .nav-links a.active { color: var(--primary-2); }

  .nav-actions {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  /* ========== BUTTONS ========== */
  .btn {
    padding: 0.6rem 1.1rem;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--gradient);
    color: white;
    box-shadow: 0 4px 15px rgba(124,58,237,0.35);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(124,58,237,0.5);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--card); border-color: var(--primary); }

  .btn-icon {
    padding: 0.55rem;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-icon:hover { border-color: var(--primary); color: var(--primary-2); }

  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.78rem; }
  .btn-sm.btn-icon { width: 32px; height: 32px; padding: 0; }

  /* ========== BADGE / NOTIFICATION ========== */
  .notif-btn { position: relative; }

  .notif-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--danger);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
  }

  /* ========== MAIN ========== */
  main {
    max-width: 1500px;
    margin: 0 auto;
    padding: 1.8rem;
  }

  .page { display: none; animation: fadeIn 0.35s; }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========== HERO ========== */
  .hero {
    padding: 3.5rem 2rem;
    text-align: center;
    background: linear-gradient(135deg, var(--primary-soft), rgba(6,182,212,0.06));
    border-radius: 24px;
    margin-bottom: 2rem;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, var(--primary-soft) 0%, transparent 40%);
    animation: rotate 25s linear infinite;
    pointer-events: none;
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .hero h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.8rem);
    font-weight: 900;
    margin-bottom: 0.8rem;
    background: linear-gradient(135deg, var(--text-strong), var(--primary-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
    z-index: 1;
  }

  .hero p {
    color: var(--muted);
    font-size: 1rem;
    max-width: 700px;
    margin: 0 auto 1.6rem;
    position: relative;
    z-index: 1;
  }

  .hero-buttons {
    display: flex;
    gap: 0.7rem;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }

  /* ========== STATS ========== */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.9rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--card);
    padding: 1.2rem;
    border-radius: 14px;
    border: 1px solid var(--border);
    text-align: center;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  .stat-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary-2);
    margin-bottom: 0.5rem;
  }

  .stat-number {
    font-size: 1.7rem;
    font-weight: 900;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }

  .stat-label { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }

  /* ========== SECTION TITLES ========== */
  .section-title {
    font-size: 1.4rem;
    font-weight: 800;
    margin: 2rem 0 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    justify-content: space-between;
    flex-wrap: wrap;
    color: var(--text-strong);
  }

  .section-title-text {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .section-title-text::before {
    content: '';
    width: 4px;
    height: 24px;
    background: var(--gradient);
    border-radius: 3px;
  }

  /* ========== GRID ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.1rem;
  }

  .grid-2 { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

  /* ========== CARD ========== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.3rem;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .card.clickable { cursor: pointer; }

  .card.clickable:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    background: var(--card-hover);
    box-shadow: var(--shadow-sm);
  }

  .card-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--primary-soft);
    color: var(--primary-2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.9rem;
  }

  .card-icon svg { width: 22px; height: 22px; }

  .card-icon.gold { background: rgba(251,191,36,0.15); color: var(--gold); }
  .card-icon.success { background: rgba(16,185,129,0.15); color: var(--success); }
  .card-icon.cyan { background: rgba(6,182,212,0.15); color: var(--accent); }
  .card-icon.danger { background: rgba(239,68,68,0.15); color: var(--danger); }

  .card h3 { font-size: 1.05rem; margin-bottom: 0.35rem; color: var(--text-strong); }
  .card p { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

  /* ========== BADGE ========== */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.22rem 0.65rem;
    background: var(--primary-soft);
    color: var(--primary-2);
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    margin-top: 0.4rem;
    margin-left: 0.25rem;
  }

  .badge.green { background: rgba(16,185,129,0.15); color: var(--success); }
  .badge.cyan { background: rgba(6,182,212,0.15); color: var(--accent); }
  .badge.gold { background: rgba(251,191,36,0.15); color: var(--gold); }
  .badge.red { background: rgba(239,68,68,0.15); color: var(--danger); }
  .badge.gray { background: var(--bg-2); color: var(--muted); }

  /* ========== EMPTY STATE ========== */
  .empty-state {
    text-align: center;
    padding: 3.5rem 2rem;
    color: var(--muted);
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 16px;
    grid-column: 1 / -1;
  }

  .empty-state .icon-wrap {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .empty-state .icon-wrap svg { width: 32px; height: 32px; }
  .empty-state h3 { color: var(--text-strong); margin-bottom: 0.4rem; font-size: 1.1rem; }
  .empty-state p { font-size: 0.88rem; margin-bottom: 1.2rem; }

  /* ========== FORM ========== */
  .form-group { margin-bottom: 1rem; }

  .form-group label {
    display: block;
    margin-bottom: 0.35rem;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-strong);
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 0.8rem 0.95rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .form-group textarea { resize: vertical; min-height: 100px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.9rem;
  }

  /* ========== MODAL ========== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.6rem;
    max-width: 580px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    animation: modalIn 0.3s;
    position: relative;
    box-shadow: var(--shadow);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal h2 {
    margin-bottom: 1.2rem;
    font-size: 1.25rem;
    color: var(--text-strong);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .modal-close {
    position: absolute;
    top: 1rem; left: 1rem;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    width: 32px; height: 32px;
    border-radius: 8px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  [dir="ltr"] .modal-close { left: auto; right: 1rem; }

  .modal-close:hover { background: var(--bg-2); color: var(--text); }

  /* ========== POST ========== */
  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem 1.3rem;
    margin-bottom: 0.9rem;
    transition: all 0.3s;
  }

  .post:hover { border-color: var(--primary); }

  .post-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.75rem;
  }

  .post-header-info { flex: 1; min-width: 0; }
  .post-author-name {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text-strong);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .post-meta {
    color: var(--muted);
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-top: 0.1rem;
  }
  .post-meta > span { display: inline-flex; align-items: center; gap: 0.25rem; }

  .post-title {
    font-weight: 700;
    font-size: 1.02rem;
    margin-bottom: 0.4rem;
    color: var(--text-strong);
  }

  .post-body {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ========== POST ACTIONS (like / comment / view) ========== */
  .post-actions {
    display: flex;
    gap: 0.4rem;
    margin-top: 1rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.85rem;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .action-btn:hover {
    background: var(--bg-2);
    color: var(--text);
    border-color: var(--border);
  }

  .action-btn svg { width: 16px; height: 16px; }
  .action-btn .count { font-size: 0.78rem; }

  .action-btn.liked {
    color: #ec4899;
    background: rgba(236,72,153,0.1);
    border-color: rgba(236,72,153,0.3);
  }

  .action-btn.liked svg { fill: #ec4899; }

  .action-btn.comments-open {
    color: var(--accent);
    background: rgba(6,182,212,0.1);
    border-color: rgba(6,182,212,0.3);
  }

  .action-btn.views {
    color: var(--muted);
    cursor: default;
  }

  .action-btn.views:hover {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }

  /* ========== COMMENTS SECTION ========== */
  .comments-section {
    display: none;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-soft);
    animation: slideDown 0.3s;
  }

  .comments-section.open { display: block; }

  @keyframes slideDown {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 2000px; }
  }

  .comment {
    display: flex;
    gap: 0.65rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .comment:last-child { border-bottom: none; }

  .comment-body { flex: 1; min-width: 0; }

  .comment-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.2rem;
    flex-wrap: wrap;
  }

  .comment-author {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--text-strong);
  }

  .comment-time {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .comment-text {
    font-size: 0.87rem;
    color: var(--text);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .comment-form {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border-soft);
  }

  .comment-form .avatar { flex-shrink: 0; }

  .comment-form-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .comment-form textarea {
    width: 100%;
    padding: 0.6rem 0.8rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    resize: vertical;
    min-height: 55px;
    transition: all 0.2s;
  }

  .comment-form textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .comment-form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.4rem;
  }

  /* ========== AVATAR ========== */
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    font-size: 0.95rem;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    border: 2px solid var(--border);
  }

  .avatar.sm { width: 30px; height: 30px; font-size: 0.75rem; }
  .avatar.lg { width: 60px; height: 60px; font-size: 1.4rem; }

  .rating-display {

  .notif-header {

    align-items: center;

    max-height: 60vh;
    overflow-y: auto;

  .notif-item {
    padding: 0.85rem 1.2rem;
    border-bottom: 1px solid var(--border-soft);

  .notif-item:hover { background: var(--card-hover); }
  .notif-item.unread { background: var(--primary-soft); }

    content: '';

    height: 8px;
    border-radius: 50%;
    background: var(--primary-2);
    margin-top: 0.5rem;

  .notif-content { flex: 1; min-width: 0; }
  .notif-text { font-size: 0.85rem; color: var(--text); line-height: 1.5; }
  .notif-text strong { color: var(--text-strong); }
  .notif-time { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }

  /* ========== PROFILE MODAL ========== */
  .profile-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.3rem;
    padding-bottom: 1.3rem;

  .avatar-upload {
    position: relative;
    cursor: pointer;
    display: inline-block;
  }

  .avatar-upload-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    opacity: 0;
    transition: opacity 0.2s;
  }

  /* ========== LANGUAGE SWITCHER ========== */
  .lang-switch {
    display: inline-flex;
    align-items: center;

    padding: 0.25rem;
    background: var(--card);

  /* ========== RESPONSIVE ========== */

function t(key) {
  return I18N[currentLang][key] || I18N.fa[key] || key;
}

function applyLanguage() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const translation = t(key);
    if (translation) el.textContent = translation;
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    const translation = t(key);
    if (translation) el.placeholder = translation;
  });
}

  currentLang = lang;
  DB.set('lang', lang);

  const toast = document.getElementById('toast');

    '': ''

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function toLocaleNum(n) {
  const str = String(n);
  if (currentLang === 'fa') return str.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  return str;
}

function timeAgo(timestamp) {
  const seconds = Math.floor((Date.now() - timestamp) / 1000);
  const map = {
    fa: { s: 'ثانیه', m: 'دقیقه', h: 'ساعت', d: 'روز', ago: 'پیش' },
    en: { s: 's', m: 'm', h: 'h', d: 'd', ago: 'ago' }
  };
  const l = map[currentLang];
  if (seconds < 60) return currentLang === 'fa' ? `همین حالا` : `just now`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return currentLang === 'fa' ? `${toLocaleNum(minutes)} ${l.m} ${l.ago}` : `${minutes}${l.m} ${l.ago}`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return currentLang === 'fa' ? `${toLocaleNum(hours)} ${l.h} ${l.ago}` : `${hours}${l.h} ${l.ago}`;
  const days = Math.floor(hours / 24);
  if (days < 30) return currentLang === 'fa' ? `${toLocaleNum(days)} ${l.d} ${l.ago}` : `${days}${l.d} ${l.ago}`;
  return new Date(timestamp).toLocaleDateString(currentLang === 'fa' ? 'fa-IR' : 'en-US');
}

function emptyState(iconSvg, title, desc, btnAction, btnText) {
  return `
    <div class="empty-state">
      <div class="icon-wrap">${iconSvg}</div>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(desc)}</p>
      ${btnAction ? `<button class="btn btn-primary" onclick="${btnAction}">${escapeHtml(btnText)}</button>` : ''}
    </div>
  `;
}

function avatarHtml(user, size = '') {
  const users = DB.get('users', []);
  const u = users.find(x => x.username === user);
  const avatar = u?.avatar;
  if (avatar) {
    return `<div class="avatar ${size}"><img src="${avatar}" alt="${escapeHtml(user)}"></div>`;
  }
  return `<div class="avatar ${size}">${escapeHtml((user[0] || '?').toUpperCase())}</div>`;
}

/* ============================================================

   ============================================================ */
function openAuthModal() {
  if (currentUser) return showProfile();
  openModal('authModal');
}

function handleAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value.trim();

  if (username.length < 3) return showToast(t('errors.shortUsername'), 'error');
  if (!/^[a-zA-Z0-9_آ-ی]+$/.test(username)) return showToast(t('errors.invalidUsername'), 'error');
  if (password.length < 4) return showToast(t('errors.shortPassword'), 'error');

  let users = DB.get('users', []);
  let user = users.find(u => u.username === username);

  if (user) {
    if (user.password !== password) return showToast(t('errors.wrongPassword'), 'error');
    showToast(`${t('success.login')} ${username}!`, 'success');
  } else {
    const newUser = {
      username, password,
      joined: Date.now(),
      posts: 0, likes: 0, projects: 0, tutorials: 0,
      jobs: 0, helpful: 0, comments: 0,
      avatar: null,
      notifications: [{
        id: Date.now(),
        type: 'welcome',
        from: 'system',
        text: t('notif.welcome'),
        time: Date.now(),
        read: false
      }]
    };
    users.push(newUser);
    DB.set('users', users);
    showToast(`${t('success.welcome')} ${username}!`, 'success');
  }

  currentUser = { username };
  DB.set('currentUser', currentUser);
  closeModal('authModal');
  document.getElementById('authUsername').value = '';
  document.getElementById('authPassword').value = '';
  renderAll();
  renderNavActions();
}

function logout() {
  currentUser = null;
  DB.set('currentUser', null);
  renderNavActions();
  renderAll();
  showToast(t('success.logout'), 'success');
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function getUserUnreadCount() {
  const users = DB.get('users', []);
  const u = users.find(x => x.username === currentUser?.username);
  return (u?.notifications || []).filter(n => !n.read).length;
}

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('active');
  if (panel.classList.contains('active')) renderNotifications();
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('active');
}

function renderNotifications() {
  const users = DB.get('users', []);
  const u = users.find(x => x.username === currentUser?.username);
  const notifs = (u?.notifications || []).slice().sort((a, b) => b.time - a.time);

  const list = document.getElementById('notifList');
  if (!notifs.length) {
    list.innerHTML = `<div style="padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: 0.85rem;">
      ${ICONS.inbox}<div style="margin-top: 0.5rem;">${t('notif.empty')}</div>
    </div>`;
    return;
  }

  list.innerHTML = notifs.map(n => `
    <div class="notif-item ${n.read ? '' : 'unread'}" onclick="markNotifRead(${n.id})">
      <div class="notif-content">
        <div class="notif-text">${escapeHtml(n.text)}</div>
        <div class="notif-time">${timeAgo(n.time)}</div>
      </div>
    </div>
  `).join('');
}

function markNotifRead(id) {
  const users = DB.get('users', []);
  const u = users.find(x => x.username === currentUser?.username);
  if (!u) return;
  const n = u.notifications.find(x => x.id === id);
  if (n) n.read = true;
  DB.set('users', users);
  renderNotifications();
  renderNavActions();
}

function markAllRead() {
  const users = DB.get('users', []);
  const u = users.find(x => x.username === currentUser?.username);
  if (!u) return;
  u.notifications.forEach(n => n.read = true);
  DB.set('users', users);
  renderNotifications();
  renderNavActions();
}

function addNotification(username, text) {
  if (username === currentUser?.username) return;
  const users = DB.get('users', []);
  const u = users.find(x => x.username === username);
  if (!u) return;
  u.notifications = u.notifications || [];
  u.notifications.unshift({
    id: Date.now() + Math.random(),

    time: Date.now(),
    read: false
  });

  DB.set('users', users);
}

            <span class="count">${toLocaleNum(p.views || 0)}</span>

              ${t('comments.noComments')} — ${t('comments.beFirst')}
            </div>
          `}
          ${currentUser ? `
            <div class="comment-form">
              ${avatarHtml(currentUser.username, 'sm')}
              <div class="comment-form-inner">
                <textarea id="comment-input-${p.id}" placeholder="${t('comments.placeholder')}"></textarea>
                <div class="comment-form-actions">

                    ${ICONS.send}
                    ${t('comments.submit')}
                  </button>
                </div>
              </div>
            </div>
          ` : `

function getCategoryName(cat) {
  return t('forum.tabs.' + cat);
}

function likePost(id) {
  if (!currentUser) return showToast(t('errors.login'), 'error');
  const posts = DB.get('posts', []);
  const p = posts.find(x => x.id === id);
  if (!p) return;
  p.likedBy = p.likedBy || [];

  if (p.likedBy.includes(currentUser.username)) {
    p.likedBy = p.likedBy.filter(u => u !== currentUser.username);
    p.likes = Math.max(0, (p.likes || 0) - 1);
    updateUserStat(p.author, 'likes', -1);
  } else {
    p.likedBy.push(currentUser.username);
    p.likes = (p.likes || 0) + 1;
    updateUserStat(p.author, 'likes', 1);
    updateUserStat(p.author, 'helpful', 1);
    addNotification(p.author, `${currentUser.username} ${t('notif.like')}`);
  }
  DB.set('posts', posts);
  renderPosts();
}

function addComment(postId) {
  if (!currentUser) return showToast(t('errors.login'), 'error');
  const input = document.getElementById('comment-input-' + postId);
  const text = input.value.trim();
  if (!text) return showToast(t('errors.fillAll'), 'error');

  const posts = DB.get('posts', []);
  const p = posts.find(x => x.id === postId);
  if (!p) return;

  p.commentsList = p.commentsList || [];
  p.commentsList.push({
    author: currentUser.username,
    text,
    time: Date.now()
  });
  p.comments = p.commentsList.length;
  DB.set('posts', posts);

  updateUserStat(currentUser.username, 'comments', 1);
  addNotification(p.author, `${currentUser.username} ${t('notif.comment')}`);

  input.value = '';
  renderPosts();
  showToast(t('success.commentAdded'), 'success');
}

function markPostViewed(postId) {
  if (viewedPosts.includes(postId)) return;
  viewedPosts.push(postId);
  DB.set('viewedPosts', viewedPosts);

  const posts = DB.get('posts', []);
  const p = posts.find(x => x.id === postId);
  if (p) {
    p.views = (p.views || 0) + 1;
    DB.set('posts', posts);
  }
}

function openRatingModal(author) {
  if (!currentUser) return showToast(t('errors.login'), 'error');
  const freelancers = DB.get('freelancers', []);
  const f = freelancers.find(x => x.author === author);
  if (!f) return;

  const existing = f.ratings?.find(r => r.by === currentUser.username);
  let selected = existing?.score || 0;

  const content = document.getElementById('ratingContent');
  content.innerHTML = `
    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem;">
      ${escapeHtml(author)} — ${escapeHtml(f.title)}
    </p>
    <div class="star-rating" id="ratingStars" style="justify-content: center; gap: 6px; margin: 1rem 0;">
      ${[1,2,3,4,5].map(i => `
        <span class="star ${i <= selected ? 'filled' : ''}" data-value="${i}" onclick="selectRating(${i})" style="width: 32px; height: 32px;">
          ${i <= selected ? ICONS.star : ICONS.starOutline}
        </span>
      `).join('')}
    </div>
    <div id="ratingValueText" style="text-align: center; color: var(--gold); font-weight: 700; margin-bottom: 1rem; min-height: 24px;">
      ${selected ? toLocaleNum(selected) + ' / 5' : ''}
    </div>
    <button class="btn btn-primary btn-block" onclick="submitRating('${escapeHtml(author)}')">
      ${t('rating.submit')}
    </button>
  `;
  window._selectedRating = selected;
  openModal('ratingModal');
}

function selectRating(value) {
  window._selectedRating = value;
  const container = document.getElementById('ratingStars');
  container.innerHTML = [1,2,3,4,5].map(i => `
    <span class="star ${i <= value ? 'filled' : ''}" data-value="${i}" onclick="selectRating(${i})" style="width: 32px; height: 32px;">
      ${i <= value ? ICONS.star : ICONS.starOutline}
    </span>
  `).join('');
  document.getElementById('ratingValueText').textContent = toLocaleNum(value) + ' / 5';
}

function submitRating(author) {
  const score = window._selectedRating;
  if (!score) return showToast(t('rating.select'), 'error');

  const freelancers = DB.get('freelancers', []);
  const f = freelancers.find(x => x.author === author);
  if (!f) return;

  f.ratings = f.ratings || [];
  const existing = f.ratings.findIndex(r => r.by === currentUser.username);
  if (existing >= 0) {
    f.ratings[existing].score = score;
    f.ratings[existing].time = Date.now();
  } else {
    f.ratings.push({ by: currentUser.username, score, time: Date.now() });
    addNotification(author, `${currentUser.username} ${currentLang === 'fa' ? 'به شما امتیاز داد' : 'rated you'} ${score}/5`);
  }
  DB.set('freelancers', freelancers);
  closeModal('ratingModal');
  renderFreelancers();
  showToast(t('success.ratingAdded'), 'success');
}

function filterLeaderboard(type, btn) {
  leaderboardType = type;
  document.querySelectorAll('#lbTabs .tab').forEach(t2 => t2.classList.remove('active'));
  btn.classList.add('active');
  renderLeaderboard();

function renderLeaderboard() {
  const users = DB.get('users', []);
  const freelancers = DB.get('freelancers', []);
  let data = [];

  if (leaderboardType === 'writers') {
    data = users.map(u => ({ name: u.username, score: u.posts || 0, extra: `${toLocaleNum(u.likes || 0)} ❤` }))
      .filter(u => u.score > 0).sort((a, b) => b.score - a.score);
  } else if (leaderboardType === 'helpful') {
    data = users.map(u => ({ name: u.username, score: u.helpful || 0, extra: `${toLocaleNum(u.comments || 0)} 💬` }))
      .filter(u => u.score > 0).sort((a, b) => b.score - a.score);
  } else if (leaderboardType === 'freelancers') {
    data = freelancers.map(f => {
      const r = f.ratings?.length ? (f.ratings.reduce((a, b) => a + b.score, 0) / f.ratings.length).toFixed(1) : 0;
      return { name: f.author, score: parseFloat(r) || 0, extra: f.title };
    }).sort((a, b) => b.score - a.score);
  } else if (leaderboardType === 'projects') {
    data = users.map(u => ({ name: u.username, score: u.projects || 0, extra: `${toLocaleNum(u.tutorials || 0)} 📚` }))
      .filter(u => u.score > 0).sort((a, b) => b.score - a.score);
  }

  const container = document.getElementById('leaderboardContent');
  if (!data.length) {
    container.innerHTML = emptyState(ICONS.trophy, t('empty.noData'), t('empty.beFirst'), null, null);
    return;
  }

  container.innerHTML = data.slice(0, 20).map((item, i) => {
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const itemClass = i === 0 ? 'top-1' : i === 1 ? 'top-2' : i === 2 ? 'top-3' : '';
    return `
      <div class="leaderboard-item ${itemClass}">
        <div class="rank-badge ${rankClass}">${toLocaleNum(i + 1)}</div>
        ${avatarHtml(item.name, 'sm ' + rankClass)}
        <div class="leaderboard-info">
          <div class="leaderboard-name">${escapeHtml(item.name)}</div>
          <div class="leaderboard-stats">${item.extra}</div>
        </div>
        <div class="leaderboard-score">${toLocaleNum(item.score)}</div>
      </div>
    `;
  }).join('');
}

function renderHomeLeaderboard() {
  const users = DB.get('users', []);
  const data = users.map(u => ({ name: u.username, score: u.posts || 0, likes: u.likes || 0 }))
    .filter(u => u.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);

  const container = document.getElementById('homeLeaderboard');
  if (!data.length) {
    container.innerHTML = emptyState(ICONS.trophy, t('empty.noData'), t('empty.beFirst'), null, null);
    return;
  }

  container.innerHTML = data.map((item, i) => {
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : 'bronze';
    return `
      <div class="leaderboard-item top-${i + 1}">
        <div class="rank-badge ${rankClass}">${toLocaleNum(i + 1)}</div>
        ${avatarHtml(item.name, 'sm ' + rankClass)}
        <div class="leaderboard-info">
          <div class="leaderboard-name">${escapeHtml(item.name)}</div>
          <div class="leaderboard-stats">${toLocaleNum(item.score)} · ${toLocaleNum(item.likes)} ❤</div>
        </div>
        <div class="leaderboard-score">${toLocaleNum(item.score)}</div>
      </div>
    `;
  }).join('');
}

/* ============================================================
   HOME FEATURED
   ============================================================ */
function renderFeatured() {
  const projects = DB.get('projects', []).slice(0, 3);
  const projEl = document.getElementById('featuredProjects');
  if (!projects.length) {
    projEl.innerHTML = emptyState(ICONS.gamepad, t('empty.noData'), t('empty.beFirst'), 'openNewProjectModal()', t('showcase.add'));
  } else {
    projEl.innerHTML = projects.map(p => `
      <div class="card clickable" onclick="navigate('showcase')">
        <div class="card-icon success">${ICONS.gamepad}</div>
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.desc)}</p>
        <span class="badge cyan">${escapeHtml(p.genre)}</span>
      </div>
    `).join('');
  }

  const tuts = DB.get('tutorials', []).slice(0, 3);
  const tutEl = document.getElementById('featuredTutorials');
  if (!tuts.length) {
    tutEl.innerHTML = emptyState(ICONS.book, t('empty.noData'), t('empty.beFirst'), 'openNewTutorialModal()', t('tutorials.add'));
  } else {
    tutEl.innerHTML = tuts.map(t2 => `
      <div class="card clickable" onclick="navigate('tutorials')">
        <div class="card-icon">${ICONS.book}</div>
        <h3>${escapeHtml(t2.title)}</h3>
        <p>${escapeHtml(t2.desc)}</p>
        ${t2.duration ? `<span class="badge">${escapeHtml(t2.duration)}</span>` : ''}
      </div>
    `).join('');
  }
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats() {
  const users = DB.get('users', []).length;
  const posts = DB.get('posts', []).length;
  const projects = DB.get('projects', []).length;
  const jobs = DB.get('jobs', []).length;
  const freelancers = DB.get('freelancers', []).length;

  animateNumber('statUsers', users);
  animateNumber('statPosts', posts);
  animateNumber('statProjects', projects);
  animateNumber('statJobs', jobs);
  animateNumber('statFreelancers', freelancers);

  const footer = document.getElementById('footerStats');
  if (footer) {
    const total = users + posts + projects + jobs;
    footer.textContent = `${toLocaleNum(total)} ${currentLang === 'fa' ? 'فعالیت ثبت شده' : 'activities'}`;
  }
}

function animateNumber(id, target) {
  const el = document.getElementById(id);
  if (!el) return;
  let current = 0;
  if (target === 0) { el.textContent = '0'; return; }
  const step = Math.max(1, Math.ceil(target / 20));
  clearInterval(el._timer);
  el._timer = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(el._timer); }
    el.textContent = toLocaleNum(current);
  }, 40);
}

/* ============================================================
   USER STATS
   ============================================================ */
function updateUserStat(username, field, delta = 1) {
  const users = DB.get('users', []);
  const user = users.find(u => u.username === username);
  if (user) {
    user[field] = (user[field] || 0) + delta;
    DB.set('users', users);
  }
}

/* ============================================================
   PROFILE + AVATAR UPLOAD
   ============================================================ */
function showProfile() {
  if (!currentUser) return;
  const users = DB.get('users', []);
  const user = users.find(u => u.username === currentUser.username);
  if (!user) return;

  const posts = DB.get('posts', []).filter(p => p.author === currentUser.username).length;
  const projects = DB.get('projects', []).filter(p => p.author === currentUser.username).length;
  const tutorials = DB.get('tutorials', []).filter(t2 => t2.author === currentUser.username).length;

  const avatarContent = user.avatar
    ? `<img src="${user.avatar}" alt="avatar">`
    : escapeHtml(currentUser.username[0].toUpperCase());

  document.getElementById('profileContent').innerHTML = `
    <div class="profile-header">
      <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">
        <div class="avatar xl">${avatarContent}</div>
        <div class="avatar-upload-overlay">${ICONS.camera}</div>
        <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
      </div>
      <div>
        <h2 style="margin: 0; color: var(--text-strong);">${escapeHtml(currentUser.username)}</h2>
        <p style="color: var(--muted); font-size: 0.82rem; margin-top: 0.2rem;">
          ${t('profile.memberSince')} ${new Date(user.joined).toLocaleDateString(currentLang === 'fa' ? 'fa-IR' : 'en-US')}
        </p>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; margin-bottom: 1.3rem;">
      <div class="stat-card"><div class="stat-number">${toLocaleNum(posts)}</div><div class="stat-label">${t('profile.posts')}</div></div>
      <div class="stat-card"><div class="stat-number">${toLocaleNum(projects)}</div><div class="stat-label">${t('profile.projects')}</div></div>
      <div class="stat-card"><div class="stat-number">${toLocaleNum(tutorials)}</div><div class="stat-label">${t('profile.tutorials')}</div></div>
      <div class="stat-card"><div class="stat-number">${toLocaleNum(user.likes || 0)}</div><div class="stat-label">${t('profile.likes')}</div></div>
    </div>
    <button class="btn btn-danger btn-block" onclick="logout(); closeModal('profileModal')">
      ${t('profile.logout')}
    </button>
  `;
  openModal('profileModal');
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) return showToast(currentLang === 'fa' ? 'حجم تصویر باید کمتر از ۵۰۰KB باشد' : 'Image must be under 500KB', 'error');

  const reader = new FileReader();
  reader.onload = e => {
    const users = DB.get('users', []);
    const user = users.find(u => u.username === currentUser.username);
    if (user) {
      user.avatar = e.target.result;
      DB.set('users', users);
      showProfile();
      renderNavActions();
      renderAll();
      showToast(t('success.avatarUpdated'), 'success');
    }
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   RENDER ALL
   ============================================================ */
function renderAll() {
  renderPosts();
  renderTutorials();
  renderProjects();
  renderJobs();
  renderFreelancerSkills();
  renderFreelancers();
  renderLeaderboard();
  renderHomeLeaderboard();
  renderFeatured();
  renderStats();
}

/* ============================================================
   INIT
   ============================================================ */
applyTheme();
applyLanguage();
renderNavActions();
renderAll();

// Track post views via IntersectionObserver
const viewObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const postId = parseInt(entry.target.dataset.postId);
      if (postId) markPostViewed(postId);
    }
  });
}, { threshold: 0.5 });

const postsObserver = new MutationObserver(() => {
  document.querySelectorAll('.post[data-post-id]').forEach(el => {
    if (!el._observed) {
      el._observed = true;
      viewObserver.observe(el);
    }
  });
});

postsObserver.observe(document.getElementById('postsList'), { childList: true });

// Enter key for auth
document.getElementById('authPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleAuth();
});
document.getElementById('authUsername').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authPassword').focus();
});

// Close notif panel on outside click
document.addEventListener('click', e => {
  const panel = document.getElementById('notifPanel');
  const notifBtn = e.target.closest('.notif-btn');
  if (!panel.contains(e.target) && !notifBtn) closeNotifPanel();
});
</script>
